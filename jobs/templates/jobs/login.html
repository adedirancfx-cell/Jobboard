{% extends 'jobs/base.html' %}

{% block title %}Login - JobBoard{% endblock %}

{% block content %}
<div class="max-w-md mx-auto px-4 py-8">
    <div class="bg-white/10 backdrop-blur rounded-2xl p-8">
        <h2 class="text-3xl font-bold text-center text-white mb-6">Welcome Back</h2>
        
        <form method="POST" class="space-y-4">
            {% csrf_token %}
            
            <div>
                <label class="block text-gray-300 mb-2">Username</label>
                <input type="text" name="username" required class="w-full px-4 py-3 bg-white/10 border border-white/20 rounded-lg focus:border-purple-500 focus:outline-none text-white">
            </div>
            
            <div>
                <label class="block text-gray-300 mb-2">Password</label>
                <input type="password" name="password" required class="w-full px-4 py-3 bg-white/10 border border-white/20 rounded-lg focus:border-purple-500 focus:outline-none text-white">
            </div>
            
            <button type="submit" class="w-full bg-purple-600 text-white py-3 rounded-lg font-semibold hover:bg-purple-700 transition mt-4">
                Login
            </button>
        </form>
        
        <p class="text-center text-gray-400 mt-6">
            Don't have an account? <a href="{% url 'register' %}" class="text-purple-400 hover:text-purple-300">Sign up here</a>
        </p>
    </div>
</div>
{% endblock %}
