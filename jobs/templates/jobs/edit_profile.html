{% extends 'jobs/base.html' %}

{% block title %}Edit Profile - JobBoard{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto">
    <div class="card-bg rounded-2xl p-8">
        <h2 class="text-3xl font-bold text-center text-white mb-6">Edit Profile</h2>
        
        <form method="POST" enctype="multipart/form-data" class="space-y-4">
            {% csrf_token %}
            
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-gray-300 mb-2">First Name</label>
                    <input type="text" name="first_name" value="{{ user.first_name }}" class="w-full px-4 py-3 bg-white/10 border border-white/20 rounded-lg focus:border-purple-500 focus:outline-none text-white">
                </div>
                <div>
                    <label class="block text-gray-300 mb-2">Last Name</label>
                    <input type="text" name="last_name" value="{{ user.last_name }}" class="w-full px-4 py-3 bg-white/10 border border-white/20 rounded-lg focus:border-purple-500 focus:outline-none text-white">
                </div>
            </div>
            
            <div>
                <label class="block text-gray-300 mb-2">Email *</label>
                <input type="email" name="email" value="{{ user.email }}" required class="w-full px-4 py-3 bg-white/10 border border-white/20 rounded-lg focus:border-purple-500 focus:outline-none text-white">
            </div>
            
            <div>
                <label class="block text-gray-300 mb-2">Username</label>
                <input type="text" name="username" value="{{ user.username }}" required class="w-full px-4 py-3 bg-white/10 border border-white/20 rounded-lg focus:border-purple-500 focus:outline-none text-white">
            </div>
            
            <div>
                <label class="block text-gray-300 mb-2">Phone Number</label>
                <input type="tel" name="phone_number" value="{{ user.phone_number }}" class="w-full px-4 py-3 bg-white/10 border border-white/20 rounded-lg focus:border-purple-500 focus:outline-none text-white">
            </div>
            
            <div>
                <label class="block text-gray-300 mb-2">Location</label>
                <input type="text" name="location" value="{{ user.location }}" class="w-full px-4 py-3 bg-white/10 border border-white/20 rounded-lg focus:border-purple-500 focus:outline-none text-white" placeholder="City, Country">
            </div>
            
            <div>
                <label class="block text-gray-300 mb-2">Bio</label>
                <textarea name="bio" rows="4" class="w-full px-4 py-3 bg-white/10 border border-white/20 rounded-lg focus:border-purple-500 focus:outline-none text-white">{{ user.bio }}</textarea>
            </div>
            
            <div>
                <label class="block text-gray-300 mb-2">Profile Picture</label>
                {% if user.profile_picture %}
                    <div class="mb-2">
                        <img src="{{ user.profile_picture.url }}" class="w-20 h-20 rounded-full object-cover">
                    </div>
                {% endif %}
                <input type="file" name="profile_picture" accept="image/*" class="w-full px-4 py-3 bg-white/10 border border-white/20 rounded-lg focus:border-purple-500 focus:outline-none text-white">
            </div>
            
            <button type="submit" class="w-full bg-purple-600 text-white py-3 rounded-lg font-semibold hover:bg-purple-700 transition mt-4">
                Save Changes
            </button>
        </form>
        
        <div class="mt-6 text-center">
            <a href="{% url 'profile' %}" class="text-gray-400 hover:text-white transition">Cancel</a>
        </div>
    </div>
</div>

<style>
    .card-bg {
        background: rgba(255, 255, 255, 0.08);
        backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 255, 255, 0.15);
    }
</style>
{% endblock %}
